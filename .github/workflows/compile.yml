名称: 构建 ARM64 静态二进制文件
on:
  workflow_dispatch:

作业:
  构建:
    运行平台: ubuntu-24.04-arm
步骤:
      - uses: actions/checkout@v4

      - 名称: 安装 musl 及相关工具
        运行: |
          sudo apt update
          sudo apt install -y musl-tools python3 python3-pip

      - 名称: 构建静态二进制文件
        环境:
          CC: musl-gcc
        运行: |
          pip3 install pyinstaller pillow numpy --break-system-packages
          pyinstaller --onefile --add-data "base.py:." main.py

      - 用途: actions/upload-artifact@v4
        with:
          名称: main-arm64-static
          路径: dist/main
