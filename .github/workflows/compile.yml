name: Build ARM64 Static Binary
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Install musl and tools
        run: |
          sudo apt update
          sudo apt install -y musl-tools python3 python3-pip

      - name: Build static binary
        env:
          CC: musl-gcc
        run: |
          pip3 install pyinstaller pillow numpy --break-system-packages
          pyinstaller --onefile --add-data "base.py:." main.py

      - uses: actions/upload-artifact@v4
        with:
          name: main-arm64-static
          path: dist/main
