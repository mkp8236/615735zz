name: Test ARM64 Binary
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Create test C program
        run: |
          cat > test.c << 'EOF'
          #include <stdio.h>
          int main() {
              printf("Hello from ARM64!\n");
              return 0;
          }
          EOF

      - name: Install cross-compiler
        run: |
          sudo apt update
          sudo apt install -y gcc-aarch64-linux-gnu

      - name: Compile statically
        run: |
          aarch64-linux-gnu-gcc -static -o test test.c

      - uses: actions/upload-artifact@v4
        with:
          name: test-arm64
          path: test
