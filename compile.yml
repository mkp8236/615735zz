name: Build ARM64 Binary

on: [workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y python3 python3-pip
          pip3 install pyinstaller pillow numpy --break-system-packages

      - name: Build binary
        run: |
          pyinstaller --onefile --add-data "base.py:." main.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: main-arm64
          path: dist/main